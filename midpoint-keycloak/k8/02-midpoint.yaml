apiVersion: apps/v1
kind: Deployment
metadata:
  name: midpoint
  namespace: midpoint-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: midpoint
  template:
    metadata:
      labels:
        app: midpoint
    spec:
      containers:
        - name: midpoint
          image: evolveum/midpoint:4.8
          env:
            - name: MP_SET_midpoint_repository_database
              value: "postgresql"
            - name: MP_SET_midpoint_repository_jdbcUrl
              value: "jdbc:postgresql://postgres:5432/midpoint"
            - name: MP_SET_midpoint_repository_jdbcUsername
              value: "postgres"
            - name: MP_SET_midpoint_repository_jdbcPassword
              value: "adminpassword"
            - name: MP_SET_midpoint_repository_hibernateHbm2ddl
              value: "update"
            - name: MP_SET_midpoint_repository_initializationFailTimeout
              value: "60000"
            - name: MP_SET_midpoint_administrator_initialPassword
              value: "5ecr3t"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: midpoint-data
              mountPath: /opt/midpoint/data
      volumes:
        - name: midpoint-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: midpoint
  namespace: midpoint-keycloak
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: midpoint
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: midpoint-ingress
  namespace: midpoint-keycloak
spec:
  rules:
    - host: midpoint.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: midpoint
                port:
                  number: 8080
