# NOTE: the "midpoint-scriptedsql-scripts" ConfigMap referenced below is NOT
# defined here. It is generated directly from the Groovy sources in
# midpoint/scripts/scriptedsql/ via:
#
#   kubectl create configmap midpoint-scriptedsql-scripts \
#     -n midpoint-keycloak \
#     --from-file=../midpoint/scripts/scriptedsql/ \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# This avoids keeping two copies of the same scripts in sync.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: midpoint-data
  namespace: midpoint-keycloak
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: midpoint
  namespace: midpoint-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: midpoint
  template:
    metadata:
      labels:
        app: midpoint
    spec:
      initContainers:
        - name: fetch-scriptedsql-connector
          image: curlimages/curl:8.8.0
          command:
            - sh
            - -c
            - |
              curl -sSL -o /connectors/connector-scripted-sql-2.3.jar \
                https://nexus.evolveum.com/nexus/repository/releases/com/evolveum/polygon/connector-scripted-sql/2.3/connector-scripted-sql-2.3.jar
          volumeMounts:
            - name: icf-connectors
              mountPath: /connectors
      containers:
        - name: midpoint
          image: evolveum/midpoint:4.8
          env:
            - name: MP_SET_midpoint_repository_database
              value: "postgresql"
            - name: MP_SET_midpoint_repository_jdbcUrl
              value: "jdbc:postgresql://postgres:5432/midpoint"
            - name: MP_SET_midpoint_repository_jdbcUsername
              value: "postgres"
            - name: MP_SET_midpoint_repository_jdbcPassword
              value: "adminpassword"
            - name: MP_SET_midpoint_repository_hibernateHbm2ddl
              value: "update"
            - name: MP_SET_midpoint_repository_initializationFailTimeout
              value: "60000"
            - name: MP_SET_midpoint_administrator_initialPassword
              value: "5ecr3t"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: midpoint-data
              mountPath: /opt/midpoint/var
            - name: icf-connectors
              mountPath: /opt/midpoint/var/icf-connectors
            - name: scriptedsql-scripts
              mountPath: /opt/midpoint/var/scripts
      volumes:
        - name: midpoint-data
          persistentVolumeClaim:
            claimName: midpoint-data
        - name: icf-connectors
          emptyDir: {}
        - name: scriptedsql-scripts
          configMap:
            name: midpoint-scriptedsql-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: midpoint
  namespace: midpoint-keycloak
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: midpoint
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: midpoint-ingress
  namespace: midpoint-keycloak
spec:
  rules:
    - host: midpoint.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: midpoint
                port:
                  number: 8080
